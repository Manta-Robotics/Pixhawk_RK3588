name: Maintenance checks

on:
  pull_request:
  push:
    branches:
      - main
      - codex/manta-new-board-migration

permissions:
  contents: read

concurrency:
  group: maintenance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rk3588_control_system

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rk3588_control_system/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: rk3588_control_system/requirements-test.txt

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run maintenance checks
        run: npm run maintenance

      - name: Install native control build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake nlohmann-json3-dev

      - name: Build and verify independent native control
        run: |
          cmake -S control -B control/build -DCMAKE_BUILD_TYPE=Release
          cmake --build control/build --parallel 2
          python scripts/check_native_parity.py control/build/manta-replay
          python scripts/check_native_wire.py control/build/manta-wire-replay
          node scripts/check_native_follow.mjs control/build/manta-follow-replay
          python scripts/check_native_service.py control/build/manta-control
          python scripts/check_native_stack.py control/build/manta-control
